# Render.com 部署配置
# 部署步骤：
# 1. 把 projects/sheda-daily-report-pwa 整个文件夹上传到 GitHub
# 2. 登录 https://render.com
# 3. New → Static Site → 连接到 GitHub 仓库
# 4. 构建命令留空，发布目录填 /
# 5. 同时 New → Web Service → 连接到同一个仓库
#    - Root Directory: /
#    - Build Command: npm install
#    - Start Command: npm start
# 6. 环境变量 PORT = 3001

{
  "name": "sheda-daily-report",
  "version": "1.0.0",
  "builds": [
    { "path": "server_simple.js", "type": "node" },
    { "path": "server/docx_js.js", "type": "node" },
    { "path": "index.html", "type": "static" },
    { "path": "manifest.json", "type": "static" }
  ],
  "routes": [
    { "path": "/api/generate", "type": "POST", "handler": "server_simple.js" },
    { "path": "/*", "type": "static", "source": "index.html" }
  ]
}

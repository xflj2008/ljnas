<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a56db">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>舍得日报 - 施工日志</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a56db;
      --primary-dark: #1e429f;
      --bg: #f9fafb;
      --card: #ffffff;
      --text: #111827;
      --text-secondary: #6b7280;
      --border: #e5e7eb;
      --success: #059669;
      --warning: #d97706;
      --danger: #dc2626;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Inter', 'Noto Serif SC', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 80px;
    }
    .header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      padding: 20px 16px 24px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(26,86,219,0.3);
    }
    .header h1 {
      font-family: 'Noto Serif SC', serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .header p {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 4px;
    }
    .container { padding: 16px; max-width: 600px; margin: 0 auto; }

    /* 日期卡片 */
    .date-card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .date-icon {
      width: 48px; height: 48px;
      background: linear-gradient(135deg, #dbeafe, #eff6ff);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .date-info { flex: 1; }
    .date-info .date {
      font-family: 'Noto Serif SC', serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }
    .date-info .weather {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 2px;
    }
    .weather-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #fef3c7;
      color: #92400e;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    .weather-badge.loading {
      background: #f3f4f6;
      color: #6b7280;
    }

    /* 五大板块卡片 */
    .section-card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    .section-title {
      font-family: 'Noto Serif SC', serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid #dbeafe;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title .num {
      width: 24px; height: 24px;
      background: var(--primary);
      color: white;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px;
      font-weight: 600;
    }
    textarea {
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      transition: border-color 0.2s;
      background: #fafafa;
      min-height: 70px;
    }
    textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: white;
    }
    textarea::placeholder { color: #adb5bd; }
    .tip {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 6px;
      line-height: 1.5;
    }

    /* 照片区 */
    .photo-zone {
      border: 2px dashed #dbeafe;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #f8faff;
    }
    .photo-zone:hover, .photo-zone.dragover {
      border-color: var(--primary);
      background: #eff6ff;
    }
    .photo-zone .icon { font-size: 36px; margin-bottom: 8px; }
    .photo-zone p { font-size: 13px; color: var(--text-secondary); }
    .photo-zone input { display: none; }
    .photo-preview {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    .photo-thumb {
      position: relative;
      width: 80px; height: 80px;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid var(--border);
    }
    .photo-thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .photo-thumb .del {
      position: absolute;
      top: 2px; right: 2px;
      width: 20px; height: 20px;
      background: rgba(220,38,38,0.9);
      border-radius: 50%;
      color: white;
      font-size: 12px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .photo-count {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 8px;
    }

    /* 预览/生成按钮 */
    .btn-area { padding: 16px; position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top: 1px solid var(--border); z-index: 100; }
    .btn-row { display: flex; gap: 10px; max-width: 600px; margin: 0 auto; }
    .btn {
      flex: 1; padding: 14px;
      border: none; border-radius: 12px;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 4px 12px rgba(26,86,219,0.35);
    }
    .btn-primary:active { transform: scale(0.98); box-shadow: 0 2px 6px rgba(26,86,219,0.3); }
    .btn-secondary {
      background: #f3f4f6;
      color: var(--text);
    }
    .btn-secondary:active { background: #e5e7eb; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* 预览弹窗 */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.show { display: flex; }
    .modal-sheet {
      background: white;
      border-radius: 20px 20px 0 0;
      width: 100%; max-width: 600px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 20px;
      animation: slideUp 0.3s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 16px;
    }
    .modal-header h2 {
      font-family: 'Noto Serif SC', serif;
      font-size: 18px;
    }
    .modal-close {
      width: 32px; height: 32px;
      background: #f3f4f6;
      border-radius: 50%;
      border: none; cursor: pointer;
      font-size: 16px;
      display: flex; align-items: center; justify-content: center;
    }
    .preview-content {
      font-family: 'Noto Serif SC', serif;
      font-size: 13px;
      line-height: 1.8;
      white-space: pre-wrap;
      color: #374151;
      background: #fafafa;
      border-radius: 12px;
      padding: 16px;
      max-height: 60vh;
      overflow-y: auto;
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 80px; left: 50%; transform: translateX(-50%);
      background: #1f2937;
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 14px;
      z-index: 300;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--danger); }
  </style>
</head>
<body>

<div class="header">
  <h1>📋 舍得施工日报</h1>
  <p>酒文化博物馆 · 夯土墙施工日志</p>
</div>

<div class="container">

  <!-- 日期天气 -->
  <div class="date-card">
    <div class="date-icon">📅</div>
    <div class="date-info">
      <div class="date" id="dateDisplay">加载中...</div>
      <div class="weather">
        <span class="weather-badge loading" id="weatherBadge">🔄 正在获取天气...</span>
      </div>
    </div>
  </div>

  <!-- 一、基本情况 -->
  <div class="section-card">
    <div class="section-title"><span class="num">一</span>基本情况</div>
    <textarea id="sec1" placeholder="如：项目名称：舍得酒业酒文化博物馆建设项目&#10;施工内容：夯土墙"></textarea>
    <p class="tip">每行一条内容，用回车分隔多条</p>
  </div>

  <!-- 二、人员设备 -->
  <div class="section-card">
    <div class="section-title"><span class="num">二</span>人员设备</div>
    <textarea id="sec2" placeholder="如：管理人员：2人&#10;劳务班组：夯土墙班组10人"></textarea>
    <p class="tip">每行一条内容</p>
  </div>

  <!-- 三、当日完成 -->
  <div class="section-card">
    <div class="section-title"><span class="num">三</span>当日完成</div>
    <textarea id="sec3" placeholder="如：围墙基础及地梁垫层混凝土浇筑完成&#10;夯土墙拘筑56立方米"></textarea>
    <p class="tip">每行一条内容</p>
  </div>

  <!-- 四、次日计划 -->
  <div class="section-card">
    <div class="section-title"><span class="num">四</span>次日计划</div>
    <textarea id="sec4" placeholder="如：继续夯土墙施工&#10;开始绑扎地梁钢筋"></textarea>
    <p class="tip">每行一条内容</p>
  </div>

  <!-- 五、协调问题 -->
  <div class="section-card">
    <div class="section-title"><span class="num">五</span>需要协调解决问题</div>
    <textarea id="sec5" placeholder="如：无" style="min-height:50px"></textarea>
  </div>

  <!-- 照片 -->
  <div class="section-card">
    <div class="section-title">📷 现场照片</div>
    <div class="photo-zone" id="photoZone">
      <div class="icon">📷</div>
      <p>点击或长按添加照片<br><span style="font-size:11px;color:#9ca3af">最多2张，支持 JPG/PNG</span></p>
      <input type="file" id="photoInput" accept="image/*" multiple>
    </div>
    <div class="photo-preview" id="photoPreview"></div>
    <p class="photo-count" id="photoCount"></p>
  </div>

</div>

<!-- 底部按钮 -->
<div class="btn-area">
  <div class="btn-row">
    <button class="btn btn-secondary" onclick="previewReport()">👁️ 预览</button>
    <button class="btn btn-primary" id="genBtn" onclick="generateReport()">📄 生成日报</button>
  </div>
</div>

<!-- 预览弹窗 -->
<div class="modal-overlay" id="previewModal">
  <div class="modal-sheet">
    <div class="modal-header">
      <h2>📋 日报预览</h2>
      <button class="modal-close" onclick="closePreview()">✕</button>
    </div>
    <div class="preview-content" id="previewContent"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
const WEEKDAY = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const API_KEY = '9390ffde29b447528d8347b6fa31f80f';
const LOC = '105.53,30.48';

let currentDate = '';
let weather = '';
let photoFiles = [];

// 初始化日期
function initDate() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth()+1).padStart(2,'0');
  const d = String(now.getDate()).padStart(2,'0');
  currentDate = `${y}-${m}-${d}`;
  const wd = WEEKDAY[now.getDay()];
  const md = `${y}年${m}月${d}日`;
  document.getElementById('dateDisplay').textContent = `${md} ${wd}`;
  fetchWeather();
}

// 获取天气
async function fetchWeather() {
  try {
    const resp = await fetch(`https://api.qweather.com/v7/grid-weather/3d?location=${LOC}&key=${API_KEY}`);
    const data = await resp.json();
    const today = currentDate.replace('-','');
    const day = data.daily?.find(d => d.fxDate === today);
    if (day) {
      weather = `${day.textDay} ${day.tempMin}-${day.tempMax}℃`;
      const badge = document.getElementById('weatherBadge');
      badge.textContent = '🌤️ ' + weather;
      badge.classList.remove('loading');
    } else {
      document.getElementById('weatherBadge').textContent = '⚠️ 天气获取失败';
    }
  } catch(e) {
    document.getElementById('weatherBadge').textContent = '⚠️ 天气获取失败';
  }
}

// 读取内容
function getContent() {
  return {
    基本情况: document.getElementById('sec1').value.split('\n').filter(l=>l.trim()),
    人员设备: document.getElementById('sec2').value.split('\n').filter(l=>l.trim()),
    当日完成: document.getElementById('sec3').value.split('\n').filter(l=>l.trim()),
    次日计划: document.getElementById('sec4').value.split('\n').filter(l=>l.trim()),
    协调问题: document.getElementById('sec5').value.trim() || '无'
  };
}

// 预览
function previewReport() {
  const c = getContent();
  const wd = WEEKDAY[new Date(currentDate+'T00:00:00').getDay()];
  const dateStr = `${currentDate.slice(0,4)}年${parseInt(currentDate.slice(5,7))}月${parseInt(currentDate.slice(8))}日`;
  let html = `<b>工程日报</b>\n`;
  html += `日期：${dateStr} ${wd} 天气：${weather}\n`;
  html += `项目名称：舍得酒业酒文化博物馆建设项目夯土墙施工日报\n\n`;
  html += `一、基本情况\n${c.基本情况.map(l=>'  '+l).join('\n')}\n\n`;
  html += `二、人员设备\n${c.人员设备.map(l=>'  '+l).join('\n')}\n\n`;
  html += `三、当日完成\n${c.当日完成.map(l=>'  '+l).join('\n')}\n\n`;
  html += `四、次日计划\n${c.次日计划.map(l=>'  '+l).join('\n')}\n\n`;
  html += `五、需要协调解决问题\n  ${c.协调问题}`;
  if (photoFiles.length > 0) html += `\n\n📷 照片 ${photoFiles.length} 张`;
  document.getElementById('previewContent').textContent = html;
  document.getElementById('previewModal').classList.add('show');
}

function closePreview() {
  document.getElementById('previewModal').classList.remove('show');
}

// 照片处理
const photoZone = document.getElementById('photoZone');
const photoInput = document.getElementById('photoInput');
const photoPreview = document.getElementById('photoPreview');

photoZone.onclick = () => photoInput.click();
photoZone.ondragover = e => { e.preventDefault(); photoZone.classList.add('dragover'); };
photoZone.ondragleave = () => photoZone.classList.remove('dragover');
photoZone.ondrop = e => {
  e.preventDefault();
  photoZone.classList.remove('dragover');
  handlePhotos(Array.from(e.dataTransfer.files).filter(f=>f.type.startsWith('image/')));
};

photoInput.onchange = () => {
  handlePhotos(Array.from(photoInput.files));
  photoInput.value = '';
};

function handlePhotos(files) {
  files = files.slice(0, 2 - photoFiles.length);
  photoFiles = photoFiles.concat(files);
  renderPhotos();
}

function renderPhotos() {
  photoPreview.innerHTML = '';
  photoFiles.forEach((f,i) => {
    const url = URL.createObjectURL(f);
    photoPreview.innerHTML += `<div class="photo-thumb">
      <img src="${url}" alt="照片${i+1}">
      <div class="del" onclick="delPhoto(${i})">✕</div>
    </div>`;
  });
  document.getElementById('photoCount').textContent =
    photoFiles.length ? `已选 ${photoFiles.length}/2 张` : '';
}

function delPhoto(i) {
  photoFiles.splice(i,1);
  renderPhotos();
}

// 生成日报
async function generateReport() {
  const btn = document.getElementById('genBtn');
  btn.disabled = true;
  btn.textContent = '⏳ 生成中...';
  showToast('正在生成日报...', '');

  try {
    const c = getContent();

    // 照片转 base64
    const photos = [];
    for (const f of photoFiles) {
      const base64 = await fileToBase64(f);
      photos.push({ name: f.name, data: base64 });
    }

    const resp = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        date: currentDate,
        weather: weather,
        content: c,
        photos: photos,
      })
    });

    if (!resp.ok) throw new Error('生成失败');

    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const dateStr = currentDate.replace(/-/g,'');
    a.href = url;
    a.download = `舍得酒业夯土墙施工日报_${dateStr}.docx`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('✅ 生成成功！', 'success');
  } catch(e) {
    showToast('❌ 生成失败：' + e.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '📄 生成日报';
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' '+type : '');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// 点击弹窗外部关闭
document.getElementById('previewModal').onclick = function(e) {
  if (e.target === this) closePreview();
};

// 初始化
initDate();
</script>
</body>
</html>

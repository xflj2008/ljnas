<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a56db">
  <title>施工管理系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'PingFang SC', 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(145deg, #1a56db 0%, #1e429f 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-box {
      background: white;
      border-radius: 24px;
      padding: 40px 32px;
      width: 90%;
      max-width: 360px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      text-align: center;
    }
    .logo { font-size: 56px; margin-bottom: 12px; }
    .title { font-size: 22px; font-weight: 700; color: #1a2e25; margin-bottom: 8px; }
    .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 32px; }
    .input-group { margin-bottom: 16px; }
    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      font-size: 16px;
      text-align: center;
      transition: border-color 0.2s;
    }
    input:focus { outline: none; border-color: #1a56db; }
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #1a56db, #1e429f);
      color: white;
      box-shadow: 0 4px 16px rgba(26,86,219,0.4);
    }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    .error { color: #dc2626; font-size: 13px; margin-top: 10px; min-height: 18px; }
    .app-list {
      margin-top: 24px;
      display: none;
      flex-direction: column;
      gap: 14px;
    }
    .app-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 20px;
      background: #f9fafb;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      color: inherit;
    }
    .app-card:active { background: #f3f4f6; transform: scale(0.98); }
    .app-card .icon { font-size: 32px; }
    .app-card .info .name { font-size: 16px; font-weight: 600; color: #1a2e25; }
    .app-card .info .desc { font-size: 12px; color: #9ca3af; margin-top: 2px; }
    .app-card .arrow { margin-left: auto; color: #9ca3af; font-size: 18px; }
    .logout {
      margin-top: 20px;
      font-size: 13px;
      color: #9ca3af;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="login-box">
  <div id="loginView">
    <div class="logo">🏗️</div>
    <div class="title">施工管理系统</div>
    <div class="subtitle">舍得酒业酒文化博物馆项目</div>
    <div class="input-group">
      <input type="password" id="pwdInput" placeholder="请输入访问密码" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">进入系统</button>
    <div class="error" id="errorMsg"></div>
  </div>

  <div id="menuView" style="display:none;">
    <div class="logo">🏗️</div>
    <div class="title" style="margin-bottom:24px;">施工管理系统</div>
    <a class="app-card" href="daily.html">
      <span class="icon">📋</span>
      <div class="info">
        <div class="name">施工日报</div>
        <div class="desc">夯土墙施工日志生成</div>
      </div>
      <span class="arrow">›</span>
    </a>
    <a class="app-card" href="production.html">
      <span class="icon">📊</span>
      <div class="info">
        <div class="name">产量统计</div>
        <div class="desc">施工产量数据记录与分析</div>
      </div>
      <span class="arrow">›</span>
    </a>
    <div class="logout" onclick="doLogout()">退出登录</div>
  </div>
</div>

<script>
const PASSWORD = 'sheda2026';
const MAX_ATTEMPTS = 3;

function doLogin() {
  const pwd = document.getElementById('pwdInput').value;
  if (!pwd) {
    document.getElementById('errorMsg').textContent = '请输入密码';
    return;
  }
  if (pwd === PASSWORD) {
    sessionStorage.setItem('sys_unlocked', '1');
    showMenu();
  } else {
    document.getElementById('errorMsg').textContent = '密码错误';
    document.getElementById('pwdInput').value = '';
  }
}

function showMenu() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('menuView').style.display = 'flex';
  document.querySelector('.app-list')?.remove();
  const box = document.querySelector('.login-box');
  box.querySelector('#menuView').querySelector('.logout').style.display = 'block';
}

function doLogout() {
  sessionStorage.removeItem('sys_unlocked');
  document.getElementById('loginView').style.display = 'block';
  document.getElementById('menuView').style.display = 'none';
  document.getElementById('pwdInput').value = '';
  document.getElementById('errorMsg').textContent = '';
}

// 检查是否已登录
if (sessionStorage.getItem('sys_unlocked') === '1') {
  showMenu();
}
</script>

</body>
</html>
